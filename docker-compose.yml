services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ir_block
      POSTGRES_PASSWORD: ir_block
      POSTGRES_DB: block_planning
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ir_block -d block_planning"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
